name: Weekly product catalog audit

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Find unrepresented Panda and Snapmaker products
        run: python3 scripts/check_catalog.py > missing-products.txt
      - name: Open catalog update issue
        if: hashFiles('missing-products.txt') != '' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s missing-products.txt ] && ! gh issue list --state open --search '"Catalog audit: unrepresented Panda or Snapmaker products" in:title' --json number --jq 'length > 0' | grep -q true; then
            gh issue create \
              --title "Catalog audit: unrepresented Panda or Snapmaker products" \
              --body-file missing-products.txt
          fi

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '1', filter: 'brightness(1)' },
                            '50%': { opacity: '0.8', filter: 'brightness(1.2)' },

                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

            async src="//gc.zgo.at/count.js"></script>
</head>
<body class="text-slate-200 font-sans antialiased selection:bg-emerald-500/30">
    <div id="root"></div>

    <script src="js/data/catalog.js"></script>
    <script src="js/data/placement.js"></script>
    <script src="js/layout.js"></script>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        function trackGoatEvent(path, title) {
            const payload = { path, title, event: true };
            if (window.goatcounter && window.goatcounter.count) {
                window.goatcounter.count(payload);
                return;
            }
            const started = Date.now();
            const timer = setInterval(() => {
                if (window.goatcounter && window.goatcounter.count) {
                    clearInterval(timer);
                    window.goatcounter.count(payload);
                } else if (Date.now() - started > 5000) {
                    clearInterval(timer);
                }
            }, 200);
        }

        const Icons = {
            ChevronLeft: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>,
            ExternalLink: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>,
            Check: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Link: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>,
            Printer: ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>,
            PandaFace: ({className}) => (
                <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="15" fill="#fff" />
                    <circle cx="80" cy="20" r="15" fill="#fff" />
                    <circle cx="50" cy="50" r="40" fill="#fff" />
                    <ellipse cx="30" cy="45" rx="12" ry="18" fill="#111" transform="rotate(-15 30 45)" />
                    <ellipse cx="70" cy="45" rx="12" ry="18" fill="#111" transform="rotate(15 70 45)" />
                    <circle cx="30" cy="42" r="4" fill="#fff" />
                    <circle cx="70" cy="42" r="4" fill="#fff" />
                    <ellipse cx="50" cy="60" rx="6" ry="4" fill="#111" />
                </svg>
            )
        };

        function Photo({ src, alt, className }) {
            const [failed, setFailed] = useState(!src);
            useEffect(() => { setFailed(!src); }, [src]);
            if (failed) {
                return (
                    <div className={`photo-fallback flex items-center justify-center ${className || ''}`}>
                        <Icons.Printer className="w-8 h-8 text-emerald-400/70" />
                    </div>
                );
            }
            return <img src={src} alt={alt} className={className} onError={() => setFailed(true)} />;
        }

        const SPOOL_COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#a855f7', '#f472b6'];

        function SvgDefs() {
            return (
                <defs>
                    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.18" />
                        <stop offset="55%" stopColor="#0ea5e9" stopOpacity="0.06" />
                        <stop offset="100%" stopColor="#082f49" stopOpacity="0.35" />
                    </linearGradient>
                    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#64748b" />
                        <stop offset="40%" stopColor="#334155" />
                        <stop offset="100%" stopColor="#0f172a" />
                    </linearGradient>
                    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#1e293b" />
                        <stop offset="100%" stopColor="#020617" />
                    </linearGradient>
                    <linearGradient id="orangeAccent" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stopColor="#fb923c" />
                        <stop offset="100%" stopColor="#ea580c" />
                    </linearGradient>
                    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stopColor="#ef4444" />
                        <stop offset="33%" stopColor="#10b981" />
                        <stop offset="66%" stopColor="#3b82f6" />
                        <stop offset="100%" stopColor="#a855f7" />
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#334155" />
                        <stop offset="100%" stopColor="#0f172a" />
                    </linearGradient>
                    <linearGradient id="popcapGlass" x1="0" y1="0" x2="0.35" y2="1">
                        <stop offset="0%" stopColor="#e0f2fe" stopOpacity="0.28" />
                        <stop offset="45%" stopColor="#38bdf8" stopOpacity="0.08" />
                        <stop offset="100%" stopColor="#0c4a6e" stopOpacity="0.18" />
                    </linearGradient>
                    <linearGradient id="u1Metal" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#3f3f46" />
                        <stop offset="55%" stopColor="#18181b" />
                        <stop offset="100%" stopColor="#09090b" />
                    </linearGradient>
                    <linearGradient id="silverBody" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#cbd5e1" />
                        <stop offset="45%" stopColor="#94a3b8" />
                        <stop offset="100%" stopColor="#64748b" />
                    </linearGradient>
                    <linearGradient id="charcoalBody" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#334155" />
                        <stop offset="100%" stopColor="#0f172a" />
                    </linearGradient>
                    <linearGradient id="lightFrame" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#e2e8f0" />
                        <stop offset="55%" stopColor="#cbd5e1" />
                        <stop offset="100%" stopColor="#94a3b8" />
                    </linearGradient>
                    <linearGradient id="u1White" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#f8fafc" />
                        <stop offset="60%" stopColor="#e2e8f0" />
                        <stop offset="100%" stopColor="#cbd5e1" />
                    </linearGradient>
                    <linearGradient id="isoTopLite" x1="0" y1="1" x2="1" y2="0">
                        <stop offset="0%" stopColor="#94a3b8" />
                        <stop offset="100%" stopColor="#e2e8f0" />
                    </linearGradient>
                    <linearGradient id="isoTopDark" x1="0" y1="1" x2="1" y2="0">
                        <stop offset="0%" stopColor="#0f172a" />
                        <stop offset="100%" stopColor="#334155" />
                    </linearGradient>
                    <linearGradient id="matteBlack" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#2a2a2e" />
                        <stop offset="55%" stopColor="#161618" />
                        <stop offset="100%" stopColor="#0b0b0d" />
                    </linearGradient>
                    <linearGradient id="h2Body" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#e7e5e4" />
                        <stop offset="40%" stopColor="#d6d3d1" />
                        <stop offset="100%" stopColor="#a8a29e" />
                    </linearGradient>
                    <linearGradient id="a1White" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#f8fafc" />
                        <stop offset="50%" stopColor="#e2e8f0" />
                        <stop offset="100%" stopColor="#cbd5e1" />
                    </linearGradient>
                    <linearGradient id="goldPlate" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stopColor="#fde68a" />
                        <stop offset="55%" stopColor="#f59e0b" />
                        <stop offset="100%" stopColor="#d97706" />
                    </linearGradient>
                    <linearGradient id="amsLid" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#f8fafc" stopOpacity="0.55" />
                        <stop offset="40%" stopColor="#94a3b8" stopOpacity="0.22" />
                        <stop offset="100%" stopColor="#1e293b" stopOpacity="0.35" />
                    </linearGradient>
                    <linearGradient id="amsLiteSpine" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stopColor="#f8fafc" />
                        <stop offset="55%" stopColor="#e2e8f0" />
                        <stop offset="100%" stopColor="#94a3b8" />
                    </linearGradient>
                    <linearGradient id="amsBody" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#334155" />
                        <stop offset="100%" stopColor="#0f172a" />
                    </linearGradient>
                    <linearGradient id="perchRed" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#f87171" />
                        <stop offset="100%" stopColor="#b91c1c" />
                    </linearGradient>
                    <linearGradient id="doorHandle" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stopColor="#f8fafc" />
                        <stop offset="100%" stopColor="#cbd5e1" />
                    </linearGradient>
                    <pattern id="hexCut" width="12" height="10.4" patternUnits="userSpaceOnUse">
                        <rect width="12" height="10.4" fill="#141418" />
                        <path d="M6 1 L10.2 3.3 L10.2 7.1 L6 9.4 L1.8 7.1 L1.8 3.3 Z" fill="#0b0b0e" stroke="#3f3f46" strokeWidth="0.55" />
                    </pattern>
                    <pattern id="hexCutLite" width="12" height="10.4" patternUnits="userSpaceOnUse">
                        <rect width="12" height="10.4" fill="#1c1917" />
                        <path d="M6 1 L10.2 3.3 L10.2 7.1 L6 9.4 L1.8 7.1 L1.8 3.3 Z" fill="#0c0a09" stroke="#44403c" strokeWidth="0.55" />
                    </pattern>
                    <pattern id="peiTexture" width="8" height="8" patternUnits="userSpaceOnUse">
                        <rect width="8" height="8" fill="#d97706" />
                        <path d="M0 8 L8 0" stroke="#fbbf24" strokeOpacity="0.25" strokeWidth="0.6" />
                    </pattern>
                </defs>
            );
        }

        function IsoExtrude({ x, y, w, h, top, side, stroke = '#0f172a' }) {
            const ix = PP.ISO.x;
            const iy = PP.ISO.y;
            return (
                <g>
                    <polygon
                        points={`${x + w},${y} ${x + w + ix},${y - iy} ${x + w + ix},${y - iy + h} ${x + w},${y + h}`}
                        fill={side}
                        stroke={stroke}
                    />
                    <polygon
                        points={`${x},${y} ${x + w},${y} ${x + w + ix},${y - iy} ${x + ix},${y - iy}`}
                        fill={top}
                        stroke={stroke}
                    />
                </g>
            );
        }

        function PullHandle({ x, y, w = 38, h = 6 }) {
            return (
                <g>
                    <rect x={x} y={y} width={w} height={h} rx="1.4" fill="#09090b" />
                    <rect x={x + 1.5} y={y + 1} width={w - 3} height={h - 3.2} rx="1" fill="#3f3f46" />
                </g>
            );
        }

        function Caster({ cx, cy }) {
            return (
                <g>
                    <ellipse cx={cx} cy={cy + 2} rx="9" ry="2.2" fill="#020617" opacity="0.28" />
                    <rect x={cx - 5} y={cy - 16} width="10" height="8" rx="1.4" fill="#e7e5e4" stroke="#a8a29e" />
                    <rect x={cx - 2.2} y={cy - 18} width="4.4" height="4" rx="0.8" fill="#d6d3d1" />
                    <ellipse cx={cx - 3.4} cy={cy - 5} rx="3.6" ry="5.4" fill="#292524" stroke="#78716c" />
                    <ellipse cx={cx + 3.4} cy={cy - 5} rx="3.6" ry="5.4" fill="#1c1917" stroke="#78716c" />
                    <circle cx={cx - 3.4} cy={cy - 5} r="1.15" fill="#d6d3d1" />
                    <circle cx={cx + 3.4} cy={cy - 5} r="1.15" fill="#d6d3d1" />
                </g>
            );
        }

        function BrandLine({ x, y, title, sub }) {
            return (
                <g>
                    <text x={x} y={y} fill="#f8fafc" fontSize="8" fontFamily="ui-sans-serif, system-ui" fontWeight="700">{title}</text>
                    {sub && <text x={x} y={y + 9} fill="#a1a1aa" fontSize="5.5" fontFamily="ui-sans-serif, system-ui">{sub}</text>}
                </g>
            );
        }

        function BiquMark({ x, y }) {
            return (
                <g transform={`translate(${x},${y})`} opacity="0.85">
                    <path d="M0 0 H10 V6 H4 V10 H0 Z M12 0 H16 V16 H6 V12 H12 Z" fill="#f8fafc" />
                    <text x="0" y="22" fill="#e4e4e7" fontSize="6" fontFamily="ui-sans-serif, system-ui" fontWeight="700">BIQU</text>
                </g>
            );
        }

        function PrinterScreen({ x, y, w = 30, h = 18, glow = '#38bdf8' }) {
            return (
                <g>
                    <rect x={x} y={y} width={w} height={h} rx="2.5" fill="#09090b" stroke="#3f3f46" />
                    <rect x={x + 2} y={y + 2} width={w - 4} height={h - 4} rx="1.4" fill="#082f49" />
                    <rect x={x + 3} y={y + 4} width={w - 10} height="3" rx="0.6" fill={glow} opacity="0.55" />
                    <rect x={x + 3} y={y + 9} width={w - 14} height="2" rx="0.5" fill={glow} opacity="0.28" />
                </g>
            );
        }

        function KnomiFace({ cx, cy, r = 7 }) {
            return (
                <g transform={`translate(${cx},${cy})`}>
                    <circle className="knomi-halo" r={r + 1.4} />
                    <circle r={r} fill="#111111" stroke="#f8fafc" strokeWidth="1.6" />
                    <g className="knomi-eyes">
                        <ellipse cx="-2.15" cy="-1.05" rx="1.15" ry="1.3" fill="#f8fafc" />
                        <ellipse cx="2.15" cy="-1.05" rx="1.15" ry="1.3" fill="#f8fafc" />
                    </g>
                    <path
                        className="knomi-smile"
                        d="M -2.5 2.05 Q 0 4.15 2.5 2.05"
                        strokeWidth="1.05"
                    >
                        <animate
                            attributeName="d"
                            dur="2.1s"
                            repeatCount="indefinite"
                            values="M -2.5 2.05 Q 0 4.15 2.5 2.05; M -2.75 1.55 Q 0 5.05 2.75 1.55; M -2.5 2.05 Q 0 4.15 2.5 2.05"
                        />
                    </path>
                </g>
            );
        }

        function StatusBar({ x, y, w, h = 5 }) {
            const count = Math.max(8, Math.round(w / 7));
            const ledW = (w - 2) / count;
            return (
                <g>
                    <rect x={x} y={y} width={w} height={h} rx="1.6" fill="#111111" />
                    {Array.from({ length: count }).map((_, i) => (
                        <rect
                            key={i}
                            className="led-status"
                            x={x + 1.1 + i * ledW}
                            y={y + 0.85}
                            width={Math.max(ledW - 0.7, 1.4)}
                            height={h - 1.7}
                            rx="0.7"
                            style={{ animationDelay: `${i * 0.11}s` }}
                        />
                    ))}
                </g>
            );
        }

        function LuxBar({ x, y, w, h = 5 }) {
            return <rect className="lux-bar" x={x} y={y} width={w} height={h} rx="1.4" filter="url(#glow)" />;
        }

        function DeskNode({ n }) {
            return (
                <g>
                    <IsoExtrude x={n.x} y={n.y} w={n.w} h={n.h} top="#475569" side="#1e293b" />
                    <rect x={n.x} y={n.y} width={n.w} height={n.h} rx="3" fill="url(#deskGrad)" />
                    <rect x={n.x} y={n.y} width={n.w} height="3" fill="#64748b" opacity="0.5" />
                </g>
            );
        }

        function StationNode({ n }) {
            const naked = n.variant === 'naked';
            const wheelH = n.wheelH || 16;
            const bodyH = n.h;
            const drawerH = n.drawerH || Math.round(bodyH * 0.085);
            const trayGap = (bodyH - drawerH - 36) / 2;
            const floorY = n.y + bodyH + wheelH;
            return (
                <g>
                    <ellipse cx={n.x + n.w / 2} cy={floorY + 3} rx={n.w * 0.46} ry="7" fill="#0ea5e9" opacity="0.2" filter="url(#glow)" />
                    {n.airCushion && [n.x + 24, n.x + n.w - 24].map((cx) => (
                        <ellipse key={cx} cx={cx} cy={floorY + 1} rx="13" ry="4.5" fill="#38bdf8" opacity="0.5" stroke="#67e8f9" />
                    ))}
                    <Caster cx={n.x + 24} cy={floorY} />
                    <Caster cx={n.x + n.w - 24} cy={floorY} />
                    <IsoExtrude x={n.x} y={n.y} w={n.w} h={bodyH} top="#3f3f46" side="#09090b" />
                    <BiquMark x={n.x + n.w + 8} y={n.y + 18} />
                    {naked ? (
                        <g>
                            {[0, n.w - 12].map((dx, i) => (
                                <rect key={i} x={n.x + dx} y={n.y} width="12" height={bodyH} rx="3" fill="url(#matteBlack)" stroke="#09090b" />
                            ))}
                            {n.lightingKit && <LuxBar x={n.x + 14} y={n.y + 7} w={n.w - 28} h={5} />}
                            <rect x={n.x} y={n.y} width={n.w} height={drawerH} rx="3" fill="url(#matteBlack)" stroke="#18181b" />
                            <BrandLine x={n.x + 10} y={n.y + 12} title="Panda Station" sub="For makers, by makers." />
                            <PullHandle x={n.x + n.w / 2 - 22} y={n.y + 16} w="44" />
                            {[0, 1].map((i) => {
                                const y = n.y + drawerH + 8 + i * (trayGap + 4);
                                return (
                                    <g key={i}>
                                        <rect x={n.x + 14} y={y + 8} width="6" height={trayGap - 10} rx="1" fill="#27272a" />
                                        <rect x={n.x + n.w - 20} y={y + 8} width="6" height={trayGap - 10} rx="1" fill="#27272a" />
                                        <rect x={n.x + 10} y={y} width={n.w - 20} height={trayGap} rx="2" fill="#18181b" stroke="#3f3f46" />
                                        <rect x={n.x + 14} y={y + 3} width={n.w - 28} height={trayGap - 10} rx="1.5" fill="#0c0c0e" />
                                        {n.showAms && i === 0 && (

        function StackNode({ n }) {

        function FeedRackNode({ n }) {
            const post = 8;
            const spoolTiers = 3;
            const boxTiers = 2;
            const foot = 12;
            const innerX = n.x + post + 3;
            const innerW = n.w - post * 2 - 6;
            const bodyH = n.h - foot;
            const spoolH = (bodyH * 0.56) / spoolTiers;
            const boxH = (bodyH - spoolH * spoolTiers) / boxTiers;
            const spoolColors = ['#eab308', '#3b82f6', '#22c55e', '#ef4444', '#f97316', '#a855f7', '#78716c', '#94a3b8', '#111827', '#f43f5e'];
            const spoolCount = 10;
            const boxCount = 8;
            const r = Math.min(spoolH * 0.42, innerW / spoolCount * 1.55);
            return (
                <g>
                    <IsoExtrude x={n.x} y={n.y} w={n.w} h={n.h - 4} top="#3f3f46" side="#18181b" />
                    <rect x={n.x} y={n.y} width={post} height={bodyH} fill="#1c1917" stroke="#09090b" />
                    <rect x={n.x + n.w - post} y={n.y} width={post} height={bodyH} fill="#1c1917" stroke="#09090b" />
                    <rect x={n.x + 3} y={n.y} width={3} height={bodyH} fill="#292524" />
                    <rect x={n.x + n.w - 6} y={n.y} width={3} height={bodyH} fill="#292524" />
                    {Array.from({ length: spoolTiers }).map((_, t) => {
                        const y = n.y + t * spoolH;
                        const railY = y + spoolH - 10;
                        return (
                            <g key={'s' + t}>
                                <rect x={n.x} y={railY} width={n.w} height="3.5" fill="#44403c" />
                                <rect x={n.x} y={railY - 11} width={n.w} height="3.5" fill="#44403c" />
                                {spoolColors.map((c, i) => {
                                    const cx = innerX + (i + 0.5) * (innerW / spoolCount);
                                    const cy = railY - r + 2;
                                    return (
                                        <g key={i}>
                                            <circle cx={cx} cy={cy} r={r} fill="#18181b" stroke="#0a0a0a" strokeWidth="1.2" />
                                            <circle cx={cx} cy={cy} r={r * 0.72} fill="none" stroke={c} strokeWidth={r * 0.28} />
                                            <circle cx={cx} cy={cy} r={r * 0.2} fill="#111113" stroke="#52525b" strokeWidth="0.8" />
                                        </g>
                                    );
                                })}
                            </g>
                        );
                    })}
                    {Array.from({ length: boxTiers }).map((_, t) => {
                        const y = n.y + spoolTiers * spoolH + t * boxH;
                        const slot = innerW / boxCount;
                        const bw = slot * 0.7;
                        const bh = boxH * 0.62;
                        const pivotY = y + boxH - 11;
                        return (
                            <g key={'b' + t}>
                                <rect x={n.x} y={pivotY} width={n.w} height="4" fill="#44403c" />
                                <rect x={n.x} y={pivotY - 9} width={n.w} height="3" fill="#44403c" />
                                {Array.from({ length: boxCount }).map((_, i) => {
                                    const cx = innerX + slot * (i + 0.5);
                                    return (
                                        <g key={i} transform={`rotate(-26 ${cx} ${pivotY})`}>
                                            <rect
                                                x={cx - bw / 2}
                                                y={pivotY - bh}
                                                width={bw}
                                                height={bh}
                                                rx="1.5"
                                                fill="#d6b894"
                                                stroke="#a16207"
                                            />
                                            <rect x={cx - 5} y={pivotY - bh + 8} width="10" height="8" rx="1" fill="#1c1917" />
                                        </g>
                                    );
                                })}
                            </g>
                        );
                    })}
                    <rect x={n.x} y={n.y + bodyH - 5} width={n.w} height="5" fill="#292524" />
                    <rect x={n.x + 4} y={n.y + n.h - 6} width="7" height="6" rx="1" fill="#78716c" />
                    <rect x={n.x + n.w - 11} y={n.y + n.h - 6} width="7" height="6" rx="1" fill="#78716c" />
                </g>
            );
        }

        function PopstationMiniNode({ n }) {
            const drawerGap = 8;
            const drawerH = (n.h - drawerGap - 22) / 2;
            const spoolColors = ['#eab308', '#3b82f6', '#22c55e', '#ef4444'];

        function FilamentSpool({ cx, cy, r, color }) {

        function AmsLiteNode({ n }) {
            const colors = SPOOL_COLORS;
            const cx = n.x + n.w / 2;
            const rFront = Math.min(n.w, n.h) * 0.175;
            const rRear = rFront * 0.78;
            const feederW = n.w * 0.2;
            const feederH = Math.max(18, n.h * 0.14);
            const feederY = n.y + 1;
            const feeders = [
                { x: cx - feederW - 2, y: feederY },
                { x: cx + 2, y: feederY }
            ];
            const rear = [
                { x: cx - rFront * 0.42, y: n.y + n.h * 0.32, c: colors[0], r: rRear },
                { x: cx + rFront * 0.42, y: n.y + n.h * 0.32, c: colors[1], r: rRear }
            ];
            const front = [
                { x: cx - rFront * 1.58, y: n.y + n.h * 0.73, c: colors[2], r: rFront },
                { x: cx + rFront * 1.58, y: n.y + n.h * 0.73, c: colors[3], r: rFront }
            ];
            const lean = n.w * 0.1;
            const spineW = Math.max(11, n.w * 0.1);
            const baseTop = n.y + n.h - 18;
            const side = n.placement === 'side';
            const tubeStarts = feeders.flatMap((f) => [0.32, 0.68].map((t) => ({ x: f.x + feederW * t, y: f.y + 2 })));
            const hub = (s, i) => (
                <g key={i}>
                    <FilamentSpool cx={s.x} cy={s.y} r={s.r} color={s.c} />
                    {[0, 90, 180, 270].map((deg) => (
                        <rect key={deg} x={s.x - 1.6} y={s.y - s.r * 0.42} width="3.2" height={s.r * 0.42} rx="0.8" fill="#64748b" transform={`rotate(${deg} ${s.x} ${s.y})`} />
                    ))}
                    <circle cx={s.x} cy={s.y} r={4.2} fill="#facc15" stroke="#ca8a04" />
                </g>
            );
            return (
                <g>
                    {side && tubeStarts.map((t, i) => (
                        <path
                            key={'t'+i}
                            d={`M ${t.x} ${t.y} C ${t.x - 28} ${n.y - 26 - i * 4}, ${n.x - 12} ${n.y + 2 + i * 3}, ${n.x - 20} ${n.y + 20 + i * 9}`}
                            fill="none"
                            stroke={['#e2e8f0', '#cbd5e1', '#94a3b8', '#64748b'][i]}
                            strokeWidth="2.2"
                            strokeLinecap="round"
                        />
                    ))}
                    <ellipse cx={cx} cy={n.y + n.h - 2} rx={n.w * 0.46} ry="4.5" fill="#020617" opacity="0.3" />
                    <path
                        d={`M ${n.x + 4} ${n.y + n.h} L ${cx - 18} ${baseTop} L ${cx + 18} ${baseTop} L ${n.x + n.w - 4} ${n.y + n.h} Z`}
                        fill="#111827"
                        stroke="#0f172a"
                    />
                    <path
                        d={`M ${cx - 22} ${n.y + n.h} L ${cx - 8} ${baseTop + 2} L ${cx + 8} ${baseTop + 2} L ${cx + 22} ${n.y + n.h} Z`}
                        fill="#1e293b"
                    />
                    <polygon
                        points={`${cx - spineW / 2 + lean},${feederY + feederH} ${cx + spineW / 2 + lean},${feederY + feederH} ${cx + spineW / 2 - 2},${baseTop} ${cx - spineW / 2 - 2},${baseTop}`}
                        fill="url(#amsLiteSpine)"
                        stroke="#cbd5e1"
                    />
                    <circle cx={cx + lean * 0.25} cy={n.y + n.h * 0.5} r={8} fill="#e2e8f0" stroke="#94a3b8" />
                    {rear.map(hub)}
                    {front.map(hub)}
                    {feeders.map((f, i) => (
                        <g key={'fd'+i}>
                            <rect x={f.x} y={f.y} width={feederW} height={feederH} rx="3.5" fill="#0b1220" stroke="#020617" strokeWidth="1.4" />
                            <rect x={f.x + 3} y={f.y + 3} width={feederW - 6} height="4" rx="1" fill="#1e293b" />
                            {[0.3, 0.7].map((t, k) => (
                                <circle key={k} cx={f.x + feederW * t} cy={f.y + feederH * 0.62} r={Math.max(4, feederW * 0.16)} fill="#facc15" stroke="#a16207" strokeWidth="1.2" />
                            ))}
                            {n.guard && [0.3, 0.7].map((t, k) => (
                                <rect key={'g'+k} x={f.x + feederW * t - 3} y={f.y - 5} width="6" height="6" rx="1" fill="#f8fafc" filter="url(#glow)" />
                            ))}
                        </g>
                    ))}
                </g>
            );
        }

        function EnclosedAmsNode({ n }) {
            const colors = SPOOL_COLORS;
            const pro = n.variant === 'ams_2_pro';
            const slots = 4;
            const lidH = Math.max(12, n.h * 0.26);
            const slotW = (n.w - 16) / slots;
            const ix = PP.ISO.x;
            const iy = PP.ISO.y;
            return (
                <g>
                    <IsoExtrude x={n.x} y={n.y} w={n.w} h={n.h} top={pro ? '#1e293b' : '#334155'} side="#020617" />
                    <polygon
                        points={`${n.x},${n.y} ${n.x + n.w},${n.y} ${n.x + n.w + ix},${n.y - iy} ${n.x + ix},${n.y - iy}`}
                        fill="url(#amsLid)"
                        stroke="#334155"
                    />
                    {Array.from({ length: slots }).map((_, i) => {
                        const sx = n.x + 10 + i * slotW + ix * 0.35;
                        const sy = n.y - iy * 0.55;
                        return (
                            <ellipse key={'top'+i} cx={sx + (slotW - 6) / 2} cy={sy} rx={(slotW - 8) / 2} ry={Math.max(3, iy * 0.28)} fill={colors[i]} opacity="0.85" />
                        );
                    })}
                    {pro && Array.from({ length: slots }).map((_, i) => (
                        <circle key={'port'+i} cx={n.x + 14 + i * slotW + ix * 0.4} cy={n.y - iy * 0.85} r="3.2" fill="#0f172a" stroke="#64748b" />
                    ))}
                    <rect x={n.x} y={n.y} width={n.w} height={n.h} rx="6" fill="url(#amsBody)" stroke="#334155" strokeWidth="1.6" />
                    <rect x={n.x + 5} y={n.y + 4} width={n.w - 10} height={lidH} rx="3" fill="url(#amsLid)" stroke="#475569" />
                    {Array.from({ length: slots }).map((_, i) => (
                        <ellipse
                            key={i}
                            cx={n.x + 8 + i * slotW + (slotW - 6) / 2}
                            cy={n.y + 6 + lidH * 0.42}
                            rx={(slotW - 10) / 2}
                            ry={Math.max(5, lidH * 0.28)}
                            fill={colors[i]}
                            opacity="0.7"

                    <text x={n.x + 12} y={n.y + lidH + 22} fill="#94a3b8" fontSize="7" fontFamily="ui-sans-serif, system-ui">{pro ? 'AMS 2 Pro' : 'AMS'}</text>
                    {pro
                        ? <rect className="led-pulse" x={n.x + n.w - 28} y={n.y + lidH + 14} width="16" height="5" rx="1.5" fill="#22d3ee" filter="url(#glow)" />
                        : <circle cx={n.x + n.w - 14} cy={n.y + lidH + 17} r="3" fill="#4ade80" />}
                    {pro && [0, 1, 2].map((i) => (
                        <rect key={'v'+i} x={n.x + n.w - 8} y={n.y + lidH + 26 + i * 6} width="5" height="3" rx="0.6" fill="#334155" />
                    ))}

        function AmsNode({ n }) {

        function BedSlingerPrinter({ n }) {

                    {!mini && <rect x={leftX + 4} y={gantryY} width={rightX - leftX + pillarW - 8} height="13" rx="2" fill="#cbd5e1" stroke="#94a3b8" />}

            return (

                    <polygon

                    {capH > 0 && (() => {
                        const topY = bodyY - capH;
                        const tray = 18;
                        const midY = topY + tray;
                        const botY = bodyY;
                        const hatchX = fx + 12;
                        const hatchY = midY + 8;

                        const waves = [];

                                ))}
                                <polygon
                                    points={`${fx},${topY} ${fx + n.w},${topY} ${fx + n.w + isoX},${topY - isoY} ${fx + isoX},${topY - isoY}`}
                                    fill="rgba(224,242,254,0.4)"
                                    stroke="#7dd3fc"
                                />
                                <rect x={fx + 18} y={topY + 4} width={n.w - 36} height={9} rx="2" fill="rgba(8,47,73,0.12)" stroke="#67e8f9" strokeOpacity="0.55" />
                                <path
                                    d={`M ${fx} ${botY} L ${fx} ${midY} L ${fx + n.w} ${midY} L ${fx + n.w} ${botY} Z`}
                                    fill="url(#popcapGlass)"
                                    stroke="#67e8f9"
                                    strokeWidth="1.4"
                                />
                                <rect x={hatchX} y={hatchY} width={hatchW} height={hatchH} rx="9" fill="rgba(186,230,253,0.07)" stroke="#a5f3fc" strokeWidth="1.3" />
                                {[[0, 0], [1, 0], [0, 1], [1, 1]].map(([cx, cy], i) => (
                                    <circle
                                        key={i}
                                        cx={hatchX + 8 + cx * (hatchW - 16)}
                                        cy={hatchY + 8 + cy * (hatchH - 16)}
                                        r="2.1"
                                        fill="#334155"
                                    />
                                ))}
                                <rect x={fx + n.w / 2 - 20} y={hatchY + hatchH * 0.58} width="40" height="6" rx="3" fill="#cbd5e1" stroke="#94a3b8" />
                                <rect x={fx - 2} y={botY - 7} width={n.w + 4} height="8" rx="1.5" fill="rgba(248,250,252,0.35)" stroke="#e2e8f0" />
                                <text x={fx + 10} y={botY - 12} fill="#f8fafc" fontSize="8" fontFamily="ui-sans-serif, system-ui" fontWeight="600">PopCap</text>
                            </g>
                        );
                    })()}
                </g>
            );
        }

        function PrinterNode({ n }) {
            if (n.family === 'a1' || n.family === 'a1mini') return <BedSlingerPrinter n={n} />;
            if (n.family === 'u1') return <U1Printer n={n} />;
            return <EnclosedPrinter n={n} />;
        }

        function SceneVisualizer({ scene }) {
            const order = ['desk', 'station', 'stack', 'den', 'feed_rack', 'popstation_mini', 'printer', 'perch', 'ams', 'touch'];
            const sorted = [...scene.nodes].sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
            return (
                <svg viewBox={scene.viewBox} preserveAspectRatio="xMidYMid meet" className="w-full h-full drop-shadow-2xl">
                    <SvgDefs />
                    {sorted.map((n, i) => {
                        const key = n.kind + '-' + i;
                        if (n.kind === 'desk') return <DeskNode key={key} n={n} />;
                        if (n.kind === 'station') return <StationNode key={key} n={n} />;
                        if (n.kind === 'den') return <DenNode key={key} n={n} />;
                        if (n.kind === 'stack') return <StackNode key={key} n={n} />;
                        if (n.kind === 'perch') return <PerchNode key={key} n={n} />;
                        if (n.kind === 'feed_rack') return <FeedRackNode key={key} n={n} />;
                        if (n.kind === 'popstation_mini') return <PopstationMiniNode key={key} n={n} />;
                        if (n.kind === 'ams') return <AmsNode key={key} n={n} />;
                        if (n.kind === 'touch') return <TouchNode key={key} n={n} />;
                        if (n.kind === 'printer') return <PrinterNode key={key} n={n} />;
                        return null;
                    })}
                </svg>
            );
        }

        const LOC_LABELS = {
            on_printer: 'On printer lid',
            perch: 'On Panda Perch',
            station_drawer: 'In Station drawers',
            stack_tray: 'On Stack tray',
            side: 'Beside printer'
        };

        function parseConfigFromUrl(search) {
            const q = new URLSearchParams(search || window.location.search);
            const printerId = q.get('p');
            const printer = PP.CATALOG.printers.find((p) => p.id === printerId);
            if (!printer) return null;

            const compat = new Set(PP.compatibleAccessories(printerId).map((a) => a.id));
            let accessories = new Set();
            (q.get('a') || '').split(',').forEach((raw) => {
                const id = raw.trim();
                if (!compat.has(id)) return;
                const acc = PP.CATALOG.accessories.find((x) => x.id === id);
                if (acc && acc.category === 'storage') accessories = PP.applyFurnitureToggle(accessories, id);
                else accessories.add(id);
            });

            const rawAms = q.get('ams') || 'none';
            const amsOk = PP.CATALOG.amsUnits.find((u) => u.id === rawAms && u.compat && u.compat.includes(printerId));
            const amsId = amsOk ? rawAms : 'none';
            const ams = PP.CATALOG.amsUnits.find((u) => u.id === amsId);
            let amsQty = 0;
            if (ams && ams.id !== 'none') {
                const n = parseInt(q.get('q') || '1', 10);
                amsQty = Math.min(ams.maxQty || 1, Math.max(1, Number.isFinite(n) ? n : 1));
            }
            const locs = PP.availableAmsLocations(printer, ams, accessories);
            const loc = q.get('loc') || '';
            const amsLocation = locs.includes(loc) ? loc : (PP.defaultAmsLocation(printer, ams, accessories) || 'none');
            return { printerId, accessories, amsId, amsQty, amsLocation };
        }

        function configSearch(state) {
            const url = new URL(window.location.href);
            ['p', 'a', 'ams', 'q', 'loc'].forEach((k) => url.searchParams.delete(k));
            if (!state || !state.printerId) return url.pathname + (url.hash || '');
            url.searchParams.set('p', state.printerId);
            const acc = [...(state.accessories || [])].sort().join(',');
            if (acc) url.searchParams.set('a', acc);
            if (state.amsId && state.amsId !== 'none') {
                url.searchParams.set('ams', state.amsId);
                url.searchParams.set('q', String(state.amsQty > 0 ? state.amsQty : 1));
                if (state.amsLocation && state.amsLocation !== 'none') url.searchParams.set('loc', state.amsLocation);
            }
            return url.pathname + url.search + (url.hash || '');
        }

        function applyConfigState(parsed, setters) {
            if (!parsed) {
                setters.setSelectedPrinterId(null);
                setters.setSelectedAccessories(new Set());
                setters.setAmsId('none');
                setters.setAmsQty(0);
                setters.setAmsLocation('none');
                return;
            }
            setters.setSelectedPrinterId(parsed.printerId);
            setters.setSelectedAccessories(new Set(parsed.accessories));
            setters.setAmsId(parsed.amsId);
            setters.setAmsQty(parsed.amsId === 'none' ? 0 : (parsed.amsQty || 1));
            setters.setAmsLocation(parsed.amsLocation);
        }

        const App = () => {
            const boot = parseConfigFromUrl();
            const [selectedPrinterId, setSelectedPrinterId] = useState(boot ? boot.printerId : null);
            const [selectedAccessories, setSelectedAccessories] = useState(boot ? boot.accessories : new Set());
            const [amsId, setAmsId] = useState(boot ? boot.amsId : 'none');
            const [amsQty, setAmsQty] = useState(boot ? (boot.amsQty || 1) : 1);
            const [amsLocation, setAmsLocation] = useState(boot ? boot.amsLocation : 'none');
            const [showRefPhoto, setShowRefPhoto] = useState(false);
            const [linkCopied, setLinkCopied] = useState(false);
            const [storeProductsLoaded, setStoreProductsLoaded] = useState(false);

            useEffect(() => {
                PP.loadStoreProductData().finally(() => setStoreProductsLoaded(true));
            }, []);

            const printer = PP.CATALOG.printers.find((p) => p.id === selectedPrinterId);

            const compatibleAccessories = useMemo(() => {
                if (!selectedPrinterId) return [];
                return PP.compatibleAccessories(selectedPrinterId);
            }, [selectedPrinterId]);

            const compatibleAms = useMemo(() => {
                if (!selectedPrinterId) return [];
                return PP.compatibleAms(selectedPrinterId);
            }, [selectedPrinterId]);

            const cfg = useMemo(() => PP.resolveConfig({
                printerId: selectedPrinterId,
                selectedIds: selectedAccessories,
                amsId,
                amsQty,
                amsLocation
            }), [selectedPrinterId, selectedAccessories, amsId, amsQty, amsLocation]);

            const scene = useMemo(() => PP.buildScene(cfg), [cfg]);

            const availableLocs = useMemo(() => {
                if (!printer || !cfg.ams) return [];
                return PP.availableAmsLocations(printer, cfg.ams, selectedAccessories);
            }, [printer, cfg.ams, selectedAccessories]);

            useEffect(() => {
                if (cfg.amsLocation && cfg.amsLocation !== amsLocation) {
                    setAmsLocation(cfg.amsLocation);
                }
            }, [cfg.amsLocation]);

            const skipUrlWrite = useRef(false);
            const hadPrinter = useRef(!!boot);

            useEffect(() => {
                document.title = printer ? `${printer.name} · PandaPlanner` : 'PandaPlanner';
            }, [printer]);

            useEffect(() => {
                if (skipUrlWrite.current) {
                    skipUrlWrite.current = false;
                    hadPrinter.current = !!selectedPrinterId;
                    return;
                }
                const next = configSearch({
                    printerId: selectedPrinterId,
                    accessories: selectedAccessories,
                    amsId,
                    amsQty,
                    amsLocation
                });
                const current = window.location.pathname + window.location.search + (window.location.hash || '');
                if (next === current) {
                    hadPrinter.current = !!selectedPrinterId;
                    return;
                }
                if (selectedPrinterId && !hadPrinter.current) history.pushState({ pp: 1 }, '', next);
                else history.replaceState({ pp: 1 }, '', next);
                hadPrinter.current = !!selectedPrinterId;
            }, [selectedPrinterId, selectedAccessories, amsId, amsQty, amsLocation]);

            useEffect(() => {
                const onPop = () => {
                    skipUrlWrite.current = true;
                    applyConfigState(parseConfigFromUrl(), {
                        setSelectedPrinterId,
                        setSelectedAccessories,
                        setAmsId,
                        setAmsQty,
                        setAmsLocation
                    });
                    hadPrinter.current = !!parseConfigFromUrl();
                };
                window.addEventListener('popstate', onPop);
                return () => window.removeEventListener('popstate', onPop);
            }, []);

            const resetToPicker = () => {
                setSelectedPrinterId(null);
                setSelectedAccessories(new Set());
                setAmsId('none');
                setAmsQty(0);
                setAmsLocation('none');
            };

            const copyConfigLink = async () => {
                const path = configSearch({
                    printerId: selectedPrinterId,
                    accessories: selectedAccessories,
                    amsId,
                    amsQty,
                    amsLocation
                });
                const href = window.location.origin + path;
                try {
                    await navigator.clipboard.writeText(href);
                } catch (err) {
                    const ta = document.createElement('textarea');
                    ta.value = href;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                setLinkCopied(true);
                window.setTimeout(() => setLinkCopied(false), 1600);
            };

            const startPrinter = (id) => {
                const p = PP.CATALOG.printers.find((x) => x.id === id);
                setSelectedPrinterId(id);
                setSelectedAccessories(new Set());
                const def = p ? p.defaultAms : 'none';
                setAmsId(def);
                setAmsQty(def === 'none' ? 0 : 1);
                const ams = PP.CATALOG.amsUnits.find((a) => a.id === def);
                setAmsLocation(PP.defaultAmsLocation(p, ams, new Set()));
            };

            const toggleAccessory = (id) => {
                const acc = PP.CATALOG.accessories.find((a) => a.id === id);
                setSelectedAccessories((prev) => {
                    const next = acc && acc.category === 'storage' ? PP.applyFurnitureToggle(prev, id) : (() => {
                        const n = new Set(prev);
                        if (n.has(id)) n.delete(id);
                        else n.add(id);
                        return n;
                    })();
                    if (next.has('panda_stack') && (amsId === 'ams_lite' || amsId === 'none')) {
                        setAmsId('ams_2_pro');
                        setAmsQty(1);
                        setAmsLocation('stack_tray');
                    }
                    return next;
                });
            };

            const furnitureIds = compatibleAccessories.filter((a) => a.category === 'storage').map((a) => a.id);
            const upgradeIds = compatibleAccessories.filter((a) => a.category === 'upgrade').map((a) => a.id);

            const toggleGroup = (ids) => {
                const allOn = ids.every((id) => selectedAccessories.has(id));
                setSelectedAccessories((prev) => {
                    let next = new Set(prev);
                    if (allOn) {
                        ids.forEach((id) => next.delete(id));
                        return next;
                    }
                    ids.forEach((id) => {
                        const acc = PP.CATALOG.accessories.find((a) => a.id === id);
                        if (acc && acc.category === 'storage') next = PP.applyFurnitureToggle(next, id);
                        else next.add(id);
                    });
                    return next;
                });
            };

            const amsLine = cfg.ams && (cfg.ams.id === 'ace' || cfg.ams.id === 'vivid') ? {
                id: cfg.ams.id,
                name: cfg.ams.name,
                qty: cfg.amsQty,
                kind: 'panda'
            } : (cfg.ams && cfg.ams.id !== 'none' ? {
                id: cfg.ams.id,
                name: cfg.ams.name,
                qty: cfg.amsQty,
                kind: 'scene'
            } : null);

            const bomAccessories = compatibleAccessories.filter((a) => selectedAccessories.has(a.id));
            const biquCartUrl = PP.buildBiquCartUrl(bomAccessories.map((a) => a.id), printer);
            const biquCartCount = bomAccessories.filter((a) => PP.resolveVariantId(a.id, printer)).length;

            const furnitureSelected = bomAccessories.find((a) => a.group === 'furniture');

            const groupedUpgrades = useMemo(() => {
                const groups = {};
                compatibleAccessories.forEach((a) => {
                    const g = a.group || a.category;
                    if (!groups[g]) groups[g] = [];
                    groups[g].push(a);
                });
                return groups;
            }, [compatibleAccessories]);

            const groupOrder = ['furniture', 'on-printer', 'power', 'plates', 'snapmaker'];

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={resetToPicker}>
                                <img src="img/logo.png" alt="" className="w-9 h-9 rounded-lg shrink-0" />
                                <div>
                                    <h1 className="text-xl font-black tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent leading-tight">
                                        PandaPlanner
                                    </h1>
                                    <p className="text-[10px] uppercase tracking-[0.2em] text-slate-500">Bambu + BigTreeTech Panda Verse</p>
                                </div>
                            </div>
                            <div className="text-sm font-medium text-slate-400 hidden sm:block">
                                Ultimate BTT workspace planner
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl mx-auto px-4 py-8 w-full animate-fade-in">
                        {!selectedPrinterId ? (
                            <div className="text-center py-6 space-y-3">
                                <h2 className="text-3xl md:text-4xl font-extrabold text-white tracking-tight">Plan Your PandaVerse</h2>
                                <p className="text-slate-400 max-w-2xl mx-auto text-sm md:text-base">Pick a Bambu Lab or Snapmaker printer, then stack Station, Den, Stack, Perch, and AMS the way they actually sit.</p>
                                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 pt-6 text-left">
                                    {PP.CATALOG.printers.map((p) => (
                                        <button
                                            key={p.id}
                                            onClick={() => startPrinter(p.id)}
                                            className="group rounded-xl bg-slate-900/50 border border-slate-800 hover:border-emerald-500/50 hover:bg-slate-800/80 hover:shadow-[0_0_24px_-10px_rgba(16,185,129,0.3)] transition-all duration-300 overflow-hidden text-left"
                                        >
                                            <div className="h-24 sm:h-28 flex items-center justify-center overflow-hidden">
                                                <Photo src={p.photo} alt={p.name} className="printer-cutout h-full w-full object-contain p-1.5" />
                                            </div>
                                            <div className="px-3 py-2.5">
                                                <h3 className="text-sm font-bold text-white group-hover:text-emerald-300 transition-colors leading-snug">{p.name}</h3>
                                                <p className="text-slate-500 text-[11px] mt-0.5 truncate">{p.imgLabel}</p>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-fade-in">
                                <div className="col-span-1 lg:col-span-4 flex flex-col space-y-4">
                                    <div className="flex items-center justify-between">
                                        <button onClick={resetToPicker} className="text-sm font-semibold text-slate-400 hover:text-white flex items-center gap-1 transition-colors">
                                            <Icons.ChevronLeft className="w-4 h-4"/> Back
                                        </button>
                                        <button onClick={() => toggleGroup(upgradeIds)} className="text-xs font-bold text-emerald-400 hover:text-emerald-300 uppercase tracking-wider px-3 py-1 rounded bg-emerald-500/10">
                                            {upgradeIds.length && upgradeIds.every((id) => selectedAccessories.has(id)) ? 'Clear upgrades' : 'Select upgrades'}
                                        </button>
                                    </div>

                                    <div className="rounded-xl border border-slate-800 bg-slate-900/60 p-4 space-y-3">
                                        <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider">AMS / multi-material</h3>
                                        <select
                                            className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                                            value={amsId}
                                            onChange={(e) => {
                                                const next = e.target.value;
                                                setAmsId(next);
                                                const unit = PP.CATALOG.amsUnits.find((a) => a.id === next);
                                                setAmsQty(next === 'none' ? 0 : 1);
                                                setAmsLocation(PP.defaultAmsLocation(printer, unit, selectedAccessories));
                                            }}
                                        >
                                            {compatibleAms.map((a) => (
                                                <option key={a.id} value={a.id}>{a.name}</option>
                                            ))}
                                        </select>
                                        {cfg.ams && cfg.ams.id !== 'none' && (
                                            <div className="flex items-center gap-3">
                                                <label className="text-xs text-slate-400">Qty</label>
                                                <input
                                                    type="number"
                                                    min="1"
                                                    max={cfg.ams.maxQty}
                                                    value={cfg.amsQty}
                                                    onChange={(e) => setAmsQty(Number(e.target.value))}
                                                    className="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm"
                                                />
                                                {availableLocs.length > 0 && (
                                                    <select
                                                        className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white"
                                                        value={cfg.amsLocation}
                                                        onChange={(e) => setAmsLocation(e.target.value)}
                                                    >
                                                        {availableLocs.map((loc) => (
                                                            <option key={loc} value={loc}>{LOC_LABELS[loc] || loc}</option>
                                                        ))}
                                                    </select>
                                                )}
                                            </div>
                                        )}
                                        <p className="text-xs text-slate-500 leading-relaxed">{cfg.ams && cfg.ams.desc}</p>
                                    </div>

                                    <div className="flex flex-col gap-6 lg:max-h-[calc(100vh-22rem)] overflow-y-auto pr-2 custom-scrollbar">
                                        {groupOrder.map((group) => {
                                            const items = groupedUpgrades[group];
                                            if (!items || !items.length) return null;
                                            const accent = group === 'furniture' ? 'indigo' : 'emerald';
                                            return (
                                                <div key={group} className="space-y-3">
                                                    <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider sticky top-0 bg-slate-950/80 backdrop-blur py-2 z-10">{PP.GROUP_LABELS[group] || group}</h3>
                                                    {items.map((acc) => {
                                                        const isSelected = selectedAccessories.has(acc.id);
                                                        const disabledReason = PP.isAccessoryDisabled(acc, printer, selectedAccessories, amsId);
                                                        const locked = Boolean(disabledReason) && !isSelected;
                                                        return (
                                                            <label key={acc.id} className={`flex items-start gap-3 p-3 rounded-xl border transition-all duration-300 ${locked ? 'opacity-40 cursor-not-allowed bg-slate-900/30 border-slate-800' : 'cursor-pointer'} ${isSelected ? (accent === 'indigo' ? 'bg-indigo-900/10 border-indigo-500/50' : 'bg-emerald-900/10 border-emerald-500/50') : 'bg-slate-900/50 border-slate-800 hover:border-slate-600'}`}>
                                                                <input type="checkbox" className="hidden" checked={isSelected} disabled={locked} onChange={() => !locked && toggleAccessory(acc.id)} />
                                                                <Photo src={acc.photo} alt="" className="w-12 h-12 rounded-lg object-cover shrink-0" />
                                                                <div className="pt-1">
                                                                    <div className={`w-5 h-5 rounded flex items-center justify-center ${isSelected ? (accent === 'indigo' ? 'bg-indigo-500 text-slate-900' : 'bg-emerald-500 text-slate-900') : 'border border-slate-600 bg-slate-800'}`}>
                                                                        {isSelected && <Icons.Check className="w-3 h-3" />}
                                                                    </div>
                                                                </div>
                                                                <div className="flex-1 min-w-0">
                                                                    <h4 className={`font-semibold text-sm ${isSelected ? (accent === 'indigo' ? 'text-indigo-300' : 'text-emerald-300') : 'text-white'}`}>{acc.name}</h4>
                                                                    <p className="text-xs text-slate-400 mt-1 leading-relaxed">{acc.desc}</p>
                                                                    {locked && <p className="text-[11px] text-amber-400 mt-1">{disabledReason}</p>}
                                                                </div>
                                                            </label>
                                                        );
                                                    })}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="col-span-1 lg:col-span-5 relative">
                                    <div className="sticky top-24 bg-slate-900/50 rounded-2xl border border-slate-800 flex flex-col p-4 overflow-hidden h-[52vh] lg:h-[calc(100vh-8rem)]">
                                        <div className="absolute inset-0 blueprint-grid opacity-50"></div>
                                        <div className="relative z-10 flex items-start justify-between gap-3 mb-2">
                                            <div className="bg-slate-800/80 backdrop-blur border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-mono text-slate-300 flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                                {printer.name}
                                            </div>
                                            <label className="text-[11px] text-slate-400 flex items-center gap-2 bg-slate-800/70 border border-slate-700 rounded-lg px-2 py-1 cursor-pointer">
                                                <input type="checkbox" checked={showRefPhoto} onChange={(e) => setShowRefPhoto(e.target.checked)} />
                                                Reference photo
                                            </label>
                                        </div>
                                        <p className="relative z-10 text-[11px] text-slate-400 mb-2 leading-snug">{cfg.caption}</p>
                                        {cfg.warnings.map((w, i) => (
                                            <p key={i} className="relative z-10 text-[11px] text-amber-400 mb-1">{w}</p>
                                        ))}
                                        <div className="relative z-10 flex-1 flex items-center justify-center pointer-events-none min-h-0">
                                            <SceneVisualizer scene={scene} />
                                        </div>
                                        {showRefPhoto && furnitureSelected && furnitureSelected.photo && (
                                            <div className="relative z-10 mt-2 rounded-xl overflow-hidden border border-slate-700 h-28">
                                                <Photo src={furnitureSelected.photo} alt={furnitureSelected.name} className="w-full h-full object-cover" />
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="col-span-1 lg:col-span-3">
                                    <div className="sticky top-24 bg-slate-900 rounded-2xl border border-slate-800 p-6 shadow-xl flex flex-col max-h-[calc(100vh-8rem)]">
                                        <h3 className="text-xl font-bold text-white mb-2">Your configuration</h3>
                                        <p className="text-[11px] text-slate-500 font-mono mb-3">{cfg.footprint}</p>
                                        <button
                                            type="button"
                                            onClick={copyConfigLink}
                                            className="mb-4 w-full text-xs font-semibold text-slate-300 hover:text-white border border-slate-700 hover:border-emerald-500/50 bg-slate-800/70 rounded-lg px-3 py-2 flex items-center justify-center gap-2 transition-colors"
                                        >
                                            <Icons.Link className="w-3.5 h-3.5" />
                                            {linkCopied ? 'Link copied' : 'Copy link to this setup'}
                                        </button>

                                        {bomAccessories.length === 0 && !amsLine ? (
                                            <div className="text-slate-500 text-center py-12 flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-800 rounded-xl">
                                                <Icons.PandaFace className="w-12 h-12 mb-4 opacity-20 grayscale" />
                                                <p className="text-sm">Add Panda Verse furniture or upgrades to build a BIQU cart. Bambu AMS stays in the scene only.</p>
                                            </div>
                                        ) : (
                                            <>
                                                <div className="space-y-3 mb-6 overflow-y-auto flex-1 pr-2 custom-scrollbar">
                                                    {amsLine && (
                                                        <div className="flex justify-between items-start text-sm">
                                                            <span className="text-slate-300">{amsLine.qty > 1 ? `${amsLine.qty}× ` : ''}{amsLine.name}</span>
                                                            <span className="text-[10px] uppercase tracking-wide text-slate-500 shrink-0">{amsLine.kind === 'panda' ? 'Stack tray' : 'In scene'}</span>
                                                        </div>
                                                    )}
                                                    {bomAccessories.map((acc) => (
                                                        <div key={acc.id} className="flex justify-between items-start text-sm group">
                                                            <a href={PP.productUrl(acc.id)} target="_blank" rel="noopener noreferrer" className="text-slate-300 hover:text-emerald-400 transition-colors flex items-center gap-1">
                                                                {acc.name} <Icons.ExternalLink className="opacity-0 group-hover:opacity-100 w-3 h-3" />
                                                            </a>
                                                            <span className="text-[10px] uppercase tracking-wide text-slate-500 shrink-0">{PP.resolveVariantId(acc.id, printer) ? 'BIQU cart' : 'Store page'}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                                <div className="mt-auto space-y-2">
                                                    <div className="border-t border-slate-700 pt-4 mb-2">
                                                        <p className="text-xs text-slate-500 leading-relaxed">
                                                            {biquCartUrl
                                                                ? `${biquCartCount} Panda item${biquCartCount === 1 ? '' : 's'} will be added to your BIQU cart (default China warehouse SKU).`
                                                                : 'Select Panda Verse furniture or upgrades to enable Add to Cart.'}
                                                        </p>
                                                    </div>
                                                    <button
                                                        disabled={!biquCartUrl}
                                                        onClick={() => {
                                                            if (!biquCartUrl) return;
                                                            trackGoatEvent('add-to-biqu-cart', 'Add to BIQU Cart');
                                                            window.open(biquCartUrl, '_blank');
                                                        }}
                                                        className="w-full bg-emerald-500 hover:bg-emerald-400 disabled:bg-slate-700 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed text-slate-950 font-bold py-3 px-4 rounded-xl transition-all shadow-[0_0_20px_-5px_rgba(16,185,129,0.4)] flex items-center justify-center gap-2"
                                                    >
                                                        Add to BIQU Cart <Icons.ExternalLink className="w-4 h-4" />
                                                    </button>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="border-t border-slate-800/80 mt-auto">
                        <div className="max-w-7xl mx-auto px-4 py-4 text-center text-[11px] text-slate-500 leading-relaxed space-y-1">
                            <div>
                                <a
                                    href="https://github.com/TechJeeper/PandaPlanner/issues"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="text-emerald-400 hover:text-emerald-300 underline underline-offset-2"
                                >
                                    Report issues
                                    <span className="sr-only"> (opens in a new tab)</span>
                                </a>
                            </div>
                            <div>
                                PandaPlanner is not affiliated with BIQU or BIGTREETECH and is offered free by{' '}
                                <a
                                    href="https://TechJeeper.com"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="text-emerald-400 hover:text-emerald-300 underline underline-offset-2"
                                >
                                    TechJeeper Designs
                                    <span className="sr-only"> (opens in a new tab)</span>
                                </a>
                                .
                            </div>
                            <div>
                                This site uses affiliate links. Purchases through BIQU / Awin links may earn a commission at no extra cost to you.
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
